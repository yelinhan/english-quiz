<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2EC4B6">
  <title>Chunky — 영어 회화 퀴즈</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button id="statsBtn" class="streak-area" aria-label="통계 보기">
      <span id="streak">🔥 0일 연속</span>
      <div class="prog-label"><span>오늘 학습</span><span id="todayCount">0 / 20</span></div>
      <div class="prog"><i id="progBar"></i></div>
    </button>
    <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙️</button>
  </header>

  <main id="main">
    <section id="view-quiz" class="view"></section>
    <section id="view-cloze" class="view"></section>
    <section id="view-writing" class="view"></section>
    <section id="view-lessons" class="view"></section>
    <section id="view-browse" class="view"></section>
    <section id="view-stats" class="view"></section>
  </main>

  <nav class="tabbar">
    <button data-view="quiz" class="on"><span class="ico">🃏</span>퀴즈</button>
    <button data-view="cloze"><span class="ico">✏️</span>빈칸</button>
    <button data-view="writing"><span class="ico">🤖</span>영작</button>
    <button data-view="lessons"><span class="ico">📞</span>수업</button>
    <button data-view="browse"><span class="ico">📚</span>단어장</button>
  </nav>

  <dialog id="settings">
    <h2>설정</h2>
    <label class="field">
      <span>Anthropic API 키 <small>(영작 첨삭에 사용, 이 기기에만 저장돼요)</small></span>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
    </label>
    <label class="field">
      <span>하루 목표 (카드 수)</span>
      <input type="number" id="goalInput" min="5" max="100" step="5">
    </label>
    <div class="dialog-actions">
      <button id="exportData" class="ghost">학습 기록 백업(JSON)</button>
      <button id="saveSettings" class="primary">저장</button>
    </div>
    <button id="closeSettings" class="dialog-close" aria-label="닫기">✕</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
