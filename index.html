<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2EC4B6">
  <title>Chunky — 영어 회화 퀴즈</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="authGate" hidden>
    <div class="gate-card">
      <h1>Chunky</h1>
      <p class="gate-sub">로그인하면 학습 기록이 서버에 저장되고<br>다른 기기에서도 이어서 학습할 수 있어요.</p>
      <label class="field">
        <span>아이디 <small>(2~30자)</small></span>
        <input type="text" id="gateId" placeholder="예: chunky" autocomplete="username">
      </label>
      <label class="field">
        <span>비밀번호 <small>(8자 이상)</small></span>
        <input type="password" id="gatePw" autocomplete="current-password">
      </label>
      <div class="auth-actions">
        <button id="gateLoginBtn" class="primary">로그인</button>
        <button id="gateSignupBtn" class="ghost">회원가입</button>
      </div>
      <p id="gateMsg" class="auth-msg"></p>
      <button id="gateSkip" class="gate-skip">로그인 없이 계속 <small>기록이 이 기기에만 저장돼요</small></button>
    </div>
  </div>

  <header class="top">
    <button id="statsBtn" class="streak-area" aria-label="홈으로">
      <span id="streak">🔥 0일 연속</span>
      <div class="prog-label"><span>오늘 학습</span><span id="todayCount">0 / 20</span></div>
      <div class="prog"><i id="progBar"></i></div>
    </button>
    <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙️</button>
  </header>

  <main id="main">
    <section id="view-home" class="view"></section>
    <section id="view-quiz" class="view"></section>
    <section id="view-cloze" class="view"></section>
    <section id="view-writing" class="view"></section>
    <section id="view-lessons" class="view"></section>
    <section id="view-tutor" class="view"></section>
    <section id="view-browse" class="view"></section>
  </main>

  <nav class="tabbar">
    <button data-view="home" class="on"><span class="ico">🏠</span>홈</button>
    <button data-view="quiz"><span class="ico">🃏</span>퀴즈</button>
    <button data-view="cloze"><span class="ico">✏️</span>빈칸</button>
    <button data-view="writing"><span class="ico">🤖</span>영작</button>
    <button data-view="lessons"><span class="ico">📞</span>수업</button>
    <button data-view="tutor"><span class="ico">🧑‍🏫</span>튜터</button>
    <button data-view="browse"><span class="ico">📚</span>단어장</button>
  </nav>

  <dialog id="settings">
    <h2>설정</h2>

    <div id="accountOut">
      <label class="field">
        <span>아이디 <small>(로그인하면 학습 기록이 서버에 동기화돼요)</small></span>
        <input type="text" id="authId" placeholder="예: chunky" autocomplete="username">
      </label>
      <label class="field">
        <span>비밀번호 <small>(8자 이상)</small></span>
        <input type="password" id="authPw" autocomplete="current-password">
      </label>
      <div class="auth-actions">
        <button id="loginBtn" class="primary">로그인</button>
        <button id="signupBtn" class="ghost">회원가입</button>
      </div>
    </div>
    <div id="accountIn" hidden>
      <div class="auth-row">
        <span id="authWho"></span>
        <button id="logoutBtn" class="ghost">로그아웃</button>
      </div>
    </div>
    <p id="authMsg" class="auth-msg"></p>

    <hr class="dialog-sep">
    <label class="field">
      <span>AI 공급자 <small>(영작 첨삭·뜻 자동 생성에 사용)</small></span>
      <select id="aiProviderInput">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (GPT)</option>
        <option value="gemini">Google (Gemini)</option>
      </select>
    </label>
    <label class="field">
      <span>API 키 <small>(공급자별로 이 기기에만 저장돼요)</small></span>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
    </label>
    <label class="field">
      <span>하루 목표 (카드 수)</span>
      <input type="number" id="goalInput" min="5" max="100" step="5">
    </label>
    <div class="dialog-actions">
      <button id="exportData" class="ghost">학습 기록 백업(JSON)</button>
      <button id="saveSettings" class="primary">저장</button>
    </div>
    <button id="closeSettings" class="dialog-close" aria-label="닫기">✕</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
