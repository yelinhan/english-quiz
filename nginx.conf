server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # 앱 진입점·서비스워커는 항상 최신을 받아야 함
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }

    # 단어장·수업 데이터: 짧게만 캐시 (SW가 network-first로 처리)
    location /data/ { add_header Cache-Control "no-cache"; }

    # 정적 자산
    location ~* \.(css|js|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # PocketBase (인증·동기화 API) — /pb/api/... → pocketbase:8090/api/...
    # ^~ : 위 정규식 location보다 우선. 변수 proxy_pass: 컨테이너가 없어도 nginx가 뜨도록 요청 시점에 DNS 조회.
    location ^~ /pb/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $pb_upstream http://pocketbase:8090;
        rewrite ^/pb(/.*)$ $1 break;
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 360s;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
