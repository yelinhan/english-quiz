server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # 앱 진입점·서비스워커는 항상 최신을 받아야 함
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }

    # 단어장·수업 데이터: 짧게만 캐시 (SW가 network-first로 처리)
    location /data/ { add_header Cache-Control "no-cache"; }

    # 정적 자산
    location ~* \.(css|js|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
